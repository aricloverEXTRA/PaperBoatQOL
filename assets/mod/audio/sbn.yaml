# SBN patch for TTYD64 Battle Tracks (3 safe tracks only)
# Adds 3 new BGM files and remaps battle song entries to use them

files:
  # File IDs 0xXX (appended after vanilla files)
  - id: "auto"
    file: "TTYD_BattleTheme_Updated.bgm"
    fakesize: 7440
  - id: "auto"
    file: "TTYD_BattleWon.bgm"
    fakesize: 896
  - id: "auto"
    file: "TTYD_level_up_theme.bgm"
    fakesize: 5008

songs:
  # SONG_NORMAL_BATTLE = 0x02 -> TTYD Battle Theme
  - id: 2
    file: "TTYD_BattleTheme_Updated.bgm"
    bk_files: [null, null, null]
  # SONG_BATTLE_END = 0x8B -> TTYD Battle Won
  - id: 139
    file: "TTYD_BattleWon.bgm"
    bk_files: [null, null, null]
  # SONG_LEVEL_UP = 0x8E -> TTYD Level Up Theme
  - id: 142
    file: "TTYD_level_up_theme.bgm"
    bk_files: [null, null, null]